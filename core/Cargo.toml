[package]
name = "pestana_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pestana core: chord sheet parsing, transposition, chord shapes and pitch detection"

[lib]
name = "pestana"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
