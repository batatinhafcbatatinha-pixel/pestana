# Weekly updates for the Rust core, the Android app and the GitHub Actions workflows.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every step of one workflow must run the same version of this action.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
