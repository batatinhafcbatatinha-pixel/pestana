# Builds every Pestana app from this repository's source on GitHub's runners:
#   - the Rust core's tests
#   - Android APKs (Linux runner)
#   - the Mac app (.dmg, universal) and the iPhone/iPad app (.ipa) (macOS runner)
# Every file gets a SHA-256 checksum and a signed build provenance attestation,
# so anyone can check it came from this repository, unchanged:
#   gh attestation verify <file> -R batatinhafcbatatinha-pixel/pestana
# A tag v* publishes all of them together as ONE release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: core-${{ hashFiles('core/Cargo.lock', 'core/src/**') }}
          restore-keys: core-
      - name: Test the Rust core
        working-directory: core
        run: cargo test --release

  android:
    name: Android
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            core/target
            ~/.gradle/caches
          key: android-${{ hashFiles('core/Cargo.lock', 'android/**/*.gradle.kts') }}
          restore-keys: android-

      # Signs with the release key when the repository has it (secrets);
      # otherwise the build is signed with a throwaway debug key.
      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REF: ${{ github.ref_name }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew assembleRelease --no-daemon --console=plain
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/pestana-$version-android.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "dist/pestana-$version-android-x86_64.apk"

      - name: Attest build provenance
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: android/dist/*.apk

      - name: Keep the attestation bundle
        if: github.event_name != 'pull_request'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" android/dist/attestation-android.sigstore.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: android/dist/

  apple:
    name: Mac and iPhone
    needs: core
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: apple-${{ hashFiles('core/Cargo.lock', 'core/src/**') }}
          restore-keys: apple-

      - name: Build the Rust core
        run: sh apple/build-core.sh

      - name: Generate the Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      # Ad-hoc signed (no Apple account needed); universal: Apple silicon + Intel.
      - name: Build for Mac
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Pestana.xcodeproj -scheme Pestana-macOS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build | tail -60

      # Unsigned: SideStore/AltStore sign it with the installer's Apple ID.
      - name: Build for iPhone and iPad
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Pestana.xcodeproj -scheme Pestana-iOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -60

      - name: Package
        working-directory: apple
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' ../android/app/build.gradle.kts)
          mkdir -p dist Payload
          hdiutil create -volname Pestana -srcfolder DerivedData/Build/Products/Release/Pestana.app \
            -ov -format UDZO "dist/pestana-$version-mac.dmg"
          cp -R DerivedData/Build/Products/Release-iphoneos/Pestana.app Payload/
          zip -qry "dist/pestana-$version-iphone.ipa" Payload

      - name: Attest build provenance
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apple/dist/*.dmg
            apple/dist/*.ipa

      - name: Keep the attestation bundle
        if: github.event_name != 'pull_request'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" apple/dist/attestation-apple.sigstore.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple
          path: apple/dist/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, apple]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish one release with every platform
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.apk *.dmg *.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<EOF
          **Android:** \`pestana-*-android.apk\` (x86_64 only for emulators/Chromebooks).
          **Mac:** \`pestana-*-mac.dmg\` (Apple silicon and Intel). First open: right-click › Open, since the app is not notarized.
          **iPhone/iPad:** \`pestana-*-iphone.ipa\`, install with SideStore or AltStore.

          Built from source by GitHub Actions. Check any file with:
          \`gh attestation verify <file> -R $REPO\`
          EOF
          gh release create "$TAG" * --repo "$REPO" --verify-tag --title "Pestana ${TAG#v}" --notes-file notes.md \
            || gh release upload "$TAG" * --repo "$REPO" --clobber
