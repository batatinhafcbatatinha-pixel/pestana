# Tests the Rust core, then builds the APKs (one per ABI).
# A tag v* publishes them as a GitHub release.
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/target
            ~/.gradle/caches
          key: android-${{ hashFiles('core/Cargo.lock', 'android/**/*.gradle.kts') }}
          restore-keys: android-
      - name: Test the core
        working-directory: core
        run: cargo test --release
      - name: Build the APKs
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew assembleRelease --no-daemon --console=plain
          mkdir -p dist
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/pestana-$version.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "dist/pestana-$version-x86_64.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pestana-apk
          path: android/dist/
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" android/dist/* --prerelease --verify-tag --title "Pestana ${TAG#v}" --notes "Built by GitHub Actions." || gh release upload "$TAG" android/dist/* --clobber
